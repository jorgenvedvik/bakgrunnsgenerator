<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakgrunnsgenerator</title>
<meta name="description" content="Lag nye utsnitt av Patentstyrets logobakgrunn og eksporter som PNG eller SVG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400&display=swap">
<style>
/* Layout: kontrollpanel til venstre, stor forhåndsvisning til høyre. Én bevisst mørk merkevareflate. */
:root {
  --brand-bg: #00342e;      /* bakgrunnsfarge */
  --brand-shape: #002b25;   /* logosymbol-utsnitt */
  --ink: #e9f2ef;
  --ink-dim: #9fb8b2;
  --line: #0d4a42;
  --panel: #00241f;
  --field: #003029;
  --accent: #d4f26a;        /* lime fra malene */
  --accent-ink: #00241f;
  --font-ui: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--panel);
  color: var(--ink);
  font: 400 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
.app {
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  height: 100%;
}
aside {
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding-block: 20px 28px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: 20px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
header.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
header.brand svg { width: 30px; height: 30px; flex: none; }
header.brand h1 {
  margin: 0;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: -0.01em;
}
header.brand p { margin: 2px 0 0; color: var(--ink-dim); font-size: 12.5px; }

section.group { display: flex; flex-direction: column; gap: 10px; }
.label {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-dim);
  margin: 0;
}

/* Formatvalg */
.formats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.fmt {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 4px 7px;
  font: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  min-width: 0;
}
.fmt .shape { border: 1.5px solid currentColor; border-radius: 2px; opacity: .75; }
.fmt .name { font-size: 12px; line-height: 1.1; }
.fmt .dim { font: 400 10px/1 var(--font-mono); color: var(--ink-dim); }
.fmt[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.fmt[aria-pressed="true"] .dim { color: var(--accent); opacity: .8; }
.fmt:hover { border-color: #1b6a5f; }

.custom {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
}
.custom span { color: var(--ink-dim); }

input[type="number"] {
  width: 100%;
  background: var(--field);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 7px 9px;
  font: 400 13px var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* Glidere */
.slider { display: grid; grid-template-columns: 1fr 74px; gap: 4px 10px; align-items: center; }
.slider label { grid-column: 1 / -1; font-size: 13px; display: flex; justify-content: space-between; }
.slider input[type="number"] { padding: 5px 7px; font-size: 12px; text-align: right; }
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  margin: 0;
}

.row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.btn.grow, .row .btn { justify-content: center; padding-inline: 6px; }
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--ink);
  border-radius: 6px;
  padding: 7px 11px;
  font: 400 13px var(--font-ui);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { border-color: #1b6a5f; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 15px; height: 15px; }
.btn.grow { flex: 1; justify-content: center; }

.btn-random {
  appearance: none;
  width: 100%;
  border: 1px dashed #2a7a6e;
  background: transparent;
  color: var(--ink);
  border-radius: 8px;
  padding: 11px;
  font: 400 14px var(--font-ui);
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}
.btn-random:hover { border-color: var(--accent); color: var(--accent); }

.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* Eksport */
.export {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-primary {
  appearance: none;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 8px;
  padding: 13px 14px;
  font: 500 15px var(--font-ui);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary svg { width: 18px; height: 18px; }
.export .row .btn { flex: 1; justify-content: center; }
.scale-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-dim); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button {
  appearance: none; border: 0; background: var(--field); color: var(--ink);
  font: 400 12px var(--font-mono); padding: 6px 10px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.outsize { font: 400 11.5px var(--font-mono); color: var(--ink-dim); text-align: center; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Forhåndsvisning */
main {
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 1px 1px, #0a3a33 1px, transparent 0) 0 0 / 22px 22px,
    #001c18;
}
.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 32px;
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}
.canvas-wrap {
  position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
  line-height: 0;
}
#preview {
  display: block;
  cursor: grab;
  touch-action: none;
  border-radius: 2px;
}
#preview.dragging { cursor: grabbing; }
.shuffle-bar { display: flex; justify-content: center; padding: 0 16px 14px; }
.btn-shuffle {
  appearance: none; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
  border-radius: 999px; padding: 12px 22px;
  font: 500 15px var(--font-ui);
  display: inline-flex; align-items: center; gap: 9px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.btn-shuffle:hover { filter: brightness(1.06); }
.btn-shuffle:active { transform: translateY(1px); }
.hint {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 0 16px 18px;
  color: var(--ink-dim);
  font-size: 12px;
}
.hint kbd {
  font: 400 11px var(--font-mono);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--ink);
}
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px);
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 500;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  html, body { height: auto; }
  main { order: -1; }
  .stage { height: 62vh; padding: 16px; }
  aside {
    border-right: 0;
    border-top: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header class="brand">
      <svg viewBox="0 0 1448.03 1448.03" aria-hidden="true"><g fill="#ffffff"><path id="logoA" d=""/><path id="logoB" d=""/></g></svg>
      <div>
        <h1>Bakgrunnsgenerator</h1>
        <p>Utsnitt av logosymbolet for Some-maler</p>
      </div>
    </header>

    <section class="group" aria-labelledby="lbl-format">
      <p class="label" id="lbl-format">Format</p>
      <div class="formats" id="formats"></div>
      <div class="custom" id="customBox" hidden>
        <input type="number" id="cw" min="50" max="8000" step="1" aria-label="Bredde i piksler">
        <span>×</span>
        <input type="number" id="ch" min="50" max="8000" step="1" aria-label="Høyde i piksler">
      </div>
    </section>

    <section class="group" aria-labelledby="lbl-utsnitt">
      <p class="label" id="lbl-utsnitt">Utsnitt</p>
      <button class="btn-random" id="random" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        Tilfeldig utsnitt
      </button>

      <div class="slider">
        <label for="size">Skalering</label>
        <input type="range" id="size" min="30" max="1200" step="1">
        <input type="number" id="sizeN" min="30" max="1200" step="1" aria-label="Skalering i prosent">
      </div>
      <div class="slider">
        <label for="rot">Rotasjon</label>
        <input type="range" id="rot" min="-180" max="180" step="1">
        <input type="number" id="rotN" min="-180" max="180" step="1" aria-label="Rotasjon i grader">
      </div>
      <div class="row">
        <button class="btn grow" id="rotL" type="button" aria-label="Roter 90 grader mot klokka">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>−90°
        </button>
        <button class="btn grow" id="rotR" type="button" aria-label="Roter 90 grader med klokka">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>+90°
        </button>
        <button class="btn grow" id="flipX" type="button" aria-pressed="false" title="Speilvend vannrett">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7 3 12l5 5V7z"/><path d="M16 7l5 5-5 5V7z"/></svg>Speil
        </button>
        <button class="btn grow" id="flipY" type="button" aria-pressed="false" title="Speilvend loddrett">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18"/><path d="M7 8l5-5 5 5H7z"/><path d="M7 16l5 5 5-5H7z"/></svg>Vend
        </button>
      </div>
      <div class="slider">
        <label for="px">Flytt vannrett</label>
        <input type="range" id="px" min="-100" max="200" step="0.5">
        <input type="number" id="pxN" min="-100" max="200" step="0.5" aria-label="Vannrett posisjon i prosent">
      </div>
      <div class="slider">
        <label for="py">Flytt loddrett</label>
        <input type="range" id="py" min="-100" max="200" step="0.5">
        <input type="number" id="pyN" min="-100" max="200" step="0.5" aria-label="Loddrett posisjon i prosent">
      </div>
    </section>

    <section class="group" aria-labelledby="lbl-visning">
      <p class="label" id="lbl-visning">Farger og visning</p>
      <label class="check"><input type="checkbox" id="swap"> Bytt om fargene (lys form på mørk bunn)</label>
      <label class="check"><input type="checkbox" id="guide" checked> Vis hjelpelinjer for tekst og logo</label>
      <div class="row">
        <button class="btn grow" id="reset" type="button">Tilbakestill</button>
        <button class="btn grow" id="share" type="button">Kopier lenke til utsnittet</button>
      </div>
    </section>

    <section class="export" aria-labelledby="lbl-export">
      <p class="label" id="lbl-export">Eksporter</p>
      <div class="scale-pick">
        <span>PNG-oppløsning</span>
        <div class="seg" id="mult">
          <button type="button" data-m="1" aria-pressed="true">1×</button>
          <button type="button" data-m="2" aria-pressed="false">2×</button>
          <button type="button" data-m="3" aria-pressed="false">3×</button>
        </div>
      </div>
      <button class="btn-primary" id="dlPng" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Last ned PNG
      </button>
      <div class="row">
        <button class="btn" id="dlSvg" type="button">Last ned SVG (vektor)</button>
        <button class="btn" id="dlJpg" type="button">Last ned JPG</button>
      </div>
      <div class="outsize" id="outsize"></div>
    </section>
  </aside>

  <main>
    <div class="stage" id="stage">
      <div class="canvas-wrap"><canvas id="preview" tabindex="0" aria-label="Forhåndsvisning. Dra for å flytte, scroll for å skalere."></canvas></div>
    </div>
    <div class="shuffle-bar">
      <button class="btn-shuffle" id="random2" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        Nytt tilfeldig utsnitt
      </button>
    </div>
    <div class="hint">
      <span><kbd>Mellomrom</kbd> gir nytt utsnitt</span>
      <span>Dra i bildet for å flytte</span>
      <span>Scroll eller klyp for å skalere</span>
      <span><kbd>Shift</kbd> + scroll for å rotere</span>
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> finjusterer</span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script>
(() => {
  // ---------- Merkevare ----------
  const COLORS = { bg: '#00342e', shape: '#002b25' };
  const VB = 1448.03, C = VB / 2;
  const PATHS = [
    'M342.42,1022.3V449.01s381.6,0,381.6,0v-170.2s-465.8,0-465.8,0c-46.58,0-84.2,37.62-84.2,84.2v890.39c0,46.58,37.62,84.2,84.2,84.2h465.8c0-93.16-75.24-170.2-170.2-170.2H215.22s0-19.71,0-19.71c69.87,1.79,127.2-55.54,127.2-125.41h0Z',
    'M1105.61,425.73v573.29s-381.6,0-381.6,0v170.2s465.8,0,465.8,0c46.58,0,84.2-37.62,84.2-84.2V194.62c0-46.58-37.62-84.2-84.2-84.2h-465.8c0,93.16,75.24,170.2,170.2,170.2h338.6s0,19.71,0,19.71c-69.87-1.79-127.2,55.54-127.2,125.41h0Z'
  ];
  const P2D = PATHS.map(d => new Path2D(d));
  document.getElementById('logoA').setAttribute('d', PATHS[0]);
  document.getElementById('logoB').setAttribute('d', PATHS[1]);

  const FORMATS = [
    { id: 'sq',   name: 'Kvadrat',  ratio: '1:1',    w: 1080, h: 1080 },
    { id: 'p45',  name: 'Stående',  ratio: '4:5',    w: 1080, h: 1350 },
    { id: 'st',   name: 'Story',    ratio: '9:16',   w: 1080, h: 1920 },
    { id: 'li',   name: 'Lenke',    ratio: '1,91:1', w: 1200, h: 628  },
    { id: 'wide', name: 'Bred',     ratio: '16:9',   w: 1920, h: 1080 },
    { id: 'cust', name: 'Annet',    ratio: 'B×H',    w: 1080, h: 1080 },
  ];

  const DEFAULT = { f: 'sq', w: 1080, h: 1080, x: 62, y: 70, s: 330, r: -34, fx: false, fy: false, sw: false };
  let state = { ...DEFAULT };
  let guide = true;
  let mult = 1;

  // ---------- Geometri ----------
  // x, y: senter av logosymbolet i prosent av bredde/høyde
  // s: symbolets størrelse i prosent av lengste side
  function applyTransform(ctx, W, H) {
    const k = (state.s / 100) * Math.max(W, H) / VB;
    ctx.translate(state.x / 100 * W, state.y / 100 * H);
    ctx.rotate(state.r * Math.PI / 180);
    ctx.scale(k * (state.fx ? -1 : 1), k * (state.fy ? -1 : 1));
    ctx.translate(-C, -C);
  }
  function svgTransform(W, H) {
    const k = (state.s / 100) * Math.max(W, H) / VB;
    const r = n => +n.toFixed(4);
    return `translate(${r(state.x / 100 * W)} ${r(state.y / 100 * H)}) rotate(${r(state.r)}) scale(${r(k * (state.fx ? -1 : 1))} ${r(k * (state.fy ? -1 : 1))}) translate(${-C} ${-C})`;
  }
  const colors = () => state.sw ? { bg: COLORS.shape, shape: COLORS.bg } : { bg: COLORS.bg, shape: COLORS.shape };

  function paint(ctx, W, H) {
    const c = colors();
    ctx.save();
    ctx.fillStyle = c.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    applyTransform(ctx, W, H);
    ctx.fillStyle = c.shape;
    P2D.forEach(p => ctx.fill(p));
    ctx.restore();
  }

  // ---------- Forhåndsvisning ----------
  const cv = document.getElementById('preview');
  const stage = document.getElementById('stage');
  let cssW = 0, cssH = 0;

  function layout() {
    const r = stage.getBoundingClientRect();
    const cs = getComputedStyle(stage);
    const availW = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const k = Math.min(availW / state.w, availH / state.h);
    cssW = Math.max(40, Math.floor(state.w * k));
    cssH = Math.max(40, Math.floor(state.h * k));
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = cssW + 'px';
    cv.style.height = cssH + 'px';
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    draw();
  }

  function draw() {
    const ctx = cv.getContext('2d');
    const k = cv.width / state.w;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    paint(ctx, state.w, state.h);
    if (guide) drawGuides(ctx, state.w, state.h, k);
  }

  function drawGuides(ctx, W, H, k) {
    ctx.save();
    const lw = 1 / k;
    const m = Math.min(W, H) * 0.074;            // marg som i malene (~80 px på 1080)
    ctx.strokeStyle = 'rgba(212,242,106,.55)';
    ctx.lineWidth = lw;
    ctx.setLineDash([6 * lw, 5 * lw]);
    ctx.strokeRect(m, m, W - 2 * m, H - 2 * m);
    // Logosone nederst, sentrert
    const lh = Math.min(W, H) * 0.06;
    const lwid = Math.min(W, H) * 0.32;
    const ly = H - m - lh;
    ctx.fillStyle = 'rgba(212,242,106,.08)';
    ctx.fillRect((W - lwid) / 2, ly, lwid, lh);
    ctx.strokeRect((W - lwid) / 2, ly, lwid, lh);
    // Midtlinjer
    ctx.strokeStyle = 'rgba(212,242,106,.22)';
    ctx.beginPath();
    ctx.moveTo(W / 2, m); ctx.lineTo(W / 2, ly - m * 0.4);
    ctx.moveTo(m, H / 2); ctx.lineTo(W - m, H / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(212,242,106,.7)';
    ctx.font = `500 ${Math.round(Math.min(W, H) * 0.017)}px Roboto, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('LOGO', W / 2, ly + lh / 2);
    ctx.restore();
  }

  // ---------- Kontroller ----------
  const $ = id => document.getElementById(id);
  const fmtBox = $('formats');
  FORMATS.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fmt';
    b.dataset.id = f.id;
    const max = 22;
    const sw = f.id === 'cust' ? 18 : (f.w >= f.h ? max : Math.round(max * f.w / f.h));
    const sh = f.id === 'cust' ? 14 : (f.h >= f.w ? max : Math.round(max * f.h / f.w));
    b.innerHTML = `<span class="shape" style="width:${sw}px;height:${sh}px;${f.id === 'cust' ? 'border-style:dashed' : ''}"></span><span class="name">${f.name}</span><span class="dim">${f.id === 'cust' ? 'egendefinert' : f.w + '×' + f.h}</span>`;
    b.addEventListener('click', () => {
      state.f = f.id;
      if (f.id !== 'cust') { state.w = f.w; state.h = f.h; }
      sync(); layout(); saveLocal();
    });
    fmtBox.appendChild(b);
  });

  function bindPair(rangeId, numId, key, min, max) {
    const r = $(rangeId), n = $(numId);
    const set = v => {
      v = parseFloat(v);
      if (!isFinite(v)) return;
      state[key] = Math.min(max, Math.max(min, v));
      sync(); draw(); saveLocal();
    };
    r.addEventListener('input', () => set(r.value));
    n.addEventListener('change', () => set(n.value));
  }
  bindPair('size', 'sizeN', 's', 30, 1200);
  bindPair('rot', 'rotN', 'r', -180, 180);
  bindPair('px', 'pxN', 'x', -100, 200);
  bindPair('py', 'pyN', 'y', -100, 200);

  const normRot = r => { r = ((r + 180) % 360 + 360) % 360 - 180; return Math.round(r * 10) / 10; };
  $('rotL').addEventListener('click', () => { state.r = normRot(state.r - 90); sync(); draw(); saveLocal(); });
  $('rotR').addEventListener('click', () => { state.r = normRot(state.r + 90); sync(); draw(); saveLocal(); });
  $('flipX').addEventListener('click', () => { state.fx = !state.fx; sync(); draw(); saveLocal(); });
  $('flipY').addEventListener('click', () => { state.fy = !state.fy; sync(); draw(); saveLocal(); });
  $('swap').addEventListener('change', e => { state.sw = e.target.checked; draw(); saveLocal(); });
  $('guide').addEventListener('change', e => { guide = e.target.checked; draw(); });

  const clampDim = v => Math.min(8000, Math.max(50, Math.round(+v || 0)));
  $('cw').addEventListener('change', e => { state.w = clampDim(e.target.value); sync(); layout(); saveLocal(); });
  $('ch').addEventListener('change', e => { state.h = clampDim(e.target.value); sync(); layout(); saveLocal(); });

  $('reset').addEventListener('click', () => {
    const { f, w, h } = state;
    state = { ...DEFAULT, f, w, h };
    sync(); draw(); saveLocal(); toast('Utsnittet er tilbakestilt');
  });

  $('mult').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mult = +b.dataset.m; sync();
  });

  function sync() {
    fmtBox.querySelectorAll('.fmt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === state.f)));
    $('customBox').hidden = state.f !== 'cust';
    $('cw').value = state.w; $('ch').value = state.h;
    const fix = v => Math.round(v * 10) / 10;
    $('size').value = state.s; $('sizeN').value = Math.round(state.s);
    $('rot').value = state.r;  $('rotN').value = fix(state.r);
    $('px').value = state.x;   $('pxN').value = fix(state.x);
    $('py').value = state.y;   $('pyN').value = fix(state.y);
    $('flipX').setAttribute('aria-pressed', String(state.fx));
    $('flipY').setAttribute('aria-pressed', String(state.fy));
    $('swap').checked = state.sw;
    $('mult').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.m === mult)));
    $('outsize').textContent = `PNG/JPG: ${state.w * mult} × ${state.h * mult} px  ·  SVG: ${state.w} × ${state.h}`;
  }

  // ---------- Dra, scroll, klyp, tastatur ----------
  const pointers = new Map();
  let pinchStart = null;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cv.classList.add('dragging');
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), s: state.s };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);
    if (pointers.size === 1) {
      state.x += (cur.x - prev.x) / cssW * 100;
      state.y += (cur.y - prev.y) / cssH * 100;
      state.x = Math.min(200, Math.max(-100, state.x));
      state.y = Math.min(200, Math.max(-100, state.y));
    } else if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      state.s = Math.min(1200, Math.max(30, pinchStart.s * d / pinchStart.d));
    }
    sync(); draw();
  });
  const end = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) { cv.classList.remove('dragging'); saveLocal(); }
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.shiftKey) {
      const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
      state.r = normRot(state.r + Math.sign(d) * Math.min(6, Math.abs(d) * 0.05 + 1));
    } else {
      state.s = Math.min(1200, Math.max(30, state.s * Math.exp(-e.deltaY * 0.0015)));
    }
    sync(); draw(); saveLocalSoon();
  }, { passive: false });

  cv.addEventListener('keydown', e => {
    const step = e.shiftKey ? 5 : 0.5;
    const map = { ArrowLeft: ['x', -step], ArrowRight: ['x', step], ArrowUp: ['y', -step], ArrowDown: ['y', step] };
    if (map[e.key]) { e.preventDefault(); state[map[e.key][0]] += map[e.key][1]; }
    else if (e.key === '+' || e.key === '=') state.s = Math.min(1200, state.s * 1.05);
    else if (e.key === '-') state.s = Math.max(30, state.s / 1.05);
    else if (e.key === 'r' || e.key === 'R') state.r = normRot(state.r + (e.shiftKey ? -1 : 1));
    else return;
    sync(); draw(); saveLocalSoon();
  });

  // ---------- Tilfeldig utsnitt ----------
  // Prøver tilfeldige utsnitt til formen dekker en passende del av flaten (25–60 %)
  // og har en tydelig kant, slik at det blir et spennende snitt – ikke en tom eller helt fylt flate.
  const probe = document.createElement('canvas');
  function coverage(cand) {
    const PW = 96, PH = Math.max(24, Math.round(96 * state.h / state.w));
    probe.width = PW; probe.height = PH;
    const ctx = probe.getContext('2d', { willReadFrequently: true });
    const saved = state; state = cand;
    ctx.setTransform(PW / cand.w, 0, 0, PH / cand.h, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cand.w, cand.h);
    applyTransform(ctx, cand.w, cand.h);
    ctx.fillStyle = '#fff'; P2D.forEach(p => ctx.fill(p));
    state = saved;
    const d = ctx.getImageData(0, 0, PW, PH).data;
    let on = 0, edges = 0;
    for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
      const v = d[(y * PW + x) * 4] > 127;
      if (v) on++;
      if (x > 0 && v !== (d[(y * PW + x - 1) * 4] > 127)) edges++;
    }
    return { cov: on / (PW * PH), edges };
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  // Punkter i logosymbolet (i symbolets egne koordinater) der de buede overgangene ligger.
  // Tilfeldige utsnitt sikter mot ett av disse, slik at kurvene – det mest karakteristiske – kommer med.
  const FOCI = [[640, 1225], [285, 1085], [808, 195], [1163, 362], [560, 1150], [890, 290]];
  function candidate() {
    const W = state.w, H = state.h;
    const s = rnd(280, 680);
    const r = normRot(Math.floor(rnd(0, 4)) * 90 + (Math.random() < .5 ? -1 : 1) * Math.round(rnd(15, 65)));
    const fx = Math.random() < 0.35;
    const [fX, fY] = FOCI[Math.floor(Math.random() * FOCI.length)];
    const k = (s / 100) * Math.max(W, H) / VB;
    const a = r * Math.PI / 180;
    const vx = (fX - C) * k * (fx ? -1 : 1), vy = (fY - C) * k;
    const rx = vx * Math.cos(a) - vy * Math.sin(a), ry = vx * Math.sin(a) + vy * Math.cos(a);
    const dx = rnd(0.25, 0.75) * W, dy = rnd(0.25, 0.75) * H;   // hvor kurven havner i flaten
    return { ...state, s, r, fx, fy: false, x: (dx - rx) / W * 100, y: (dy - ry) / H * 100 };
  }
  function randomize() {
    let best = null;
    for (let i = 0; i < 120; i++) {
      const cand = candidate();
      if (cand.x < -100 || cand.x > 200 || cand.y < -100 || cand.y > 200) continue;
      const { cov, edges } = coverage(cand);
      const score = Math.abs(cov - 0.5) + (edges < 20 ? 1 : 0);
      if (!best || score < best.score) best = { cand, score };
      if (cov > 0.33 && cov < 0.68 && edges >= 20) { best = { cand, score }; break; }
    }
    if (!best) return;
    state = best.cand;
    sync(); draw(); saveLocal();
  }
  $('random').addEventListener('click', randomize);
  $('random2').addEventListener('click', randomize);
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    const t = e.target;
    if (t.closest && t.closest('input, button, select, textarea')) return;
    e.preventDefault(); randomize();
  });

  // ---------- Eksport ----------
  const fileBase = () => `patentstyret-bakgrunn-${state.w}x${state.h}`;
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function renderRaster(type, ext, quality) {
    const W = state.w * mult, H = state.h * mult;
    if (W * H > 268e6) { toast('Bildet blir for stort. Velg lavere oppløsning.'); return; }
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.setTransform(mult, 0, 0, mult, 0, 0);
    paint(ctx, state.w, state.h);
    c.toBlob(b => {
      if (!b) { toast('Eksporten feilet. Prøv lavere oppløsning.'); return; }
      download(b, `${fileBase()}${mult > 1 ? '@' + mult + 'x' : ''}.${ext}`);
      toast(`${ext.toUpperCase()} lastet ned`);
    }, type, quality);
  }
  $('dlPng').addEventListener('click', () => renderRaster('image/png', 'png'));
  $('dlJpg').addEventListener('click', () => renderRaster('image/jpeg', 'jpg', 0.95));
  $('dlSvg').addEventListener('click', () => {
    const { w: W, h: H } = state, c = colors();
    const svg =
`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs><clipPath id="flate"><rect width="${W}" height="${H}"/></clipPath></defs>
  <rect width="${W}" height="${H}" fill="${c.bg}"/>
  <g clip-path="url(#flate)">
    <g transform="${svgTransform(W, H)}" fill="${c.shape}">
      <path d="${PATHS[0]}"/>
      <path d="${PATHS[1]}"/>
    </g>
  </g>
</svg>
`;
    download(new Blob([svg], { type: 'image/svg+xml' }), `${fileBase()}.svg`);
    toast('SVG lastet ned');
  });

  // ---------- Lagring og deling ----------
  const KEYS = ['f', 'w', 'h', 'x', 'y', 's', 'r', 'fx', 'fy', 'sw'];
  function encode() {
    const r1 = v => typeof v === 'number' ? Math.round(v * 10) / 10 : (v === true ? 1 : v === false ? 0 : v);
    return KEYS.map(k => r1(state[k])).join('_');
  }
  function decode(str) {
    const parts = str.split('_');
    if (parts.length !== KEYS.length) return null;
    const o = {};
    KEYS.forEach((k, i) => {
      const v = parts[i];
      if (k === 'f') o[k] = FORMATS.some(f => f.id === v) ? v : 'sq';
      else if (['fx', 'fy', 'sw'].includes(k)) o[k] = v === '1';
      else o[k] = parseFloat(v);
    });
    if (KEYS.some(k => typeof o[k] === 'number' && !isFinite(o[k]))) return null;
    o.w = clampDim(o.w); o.h = clampDim(o.h);
    return o;
  }
  function saveLocal() { try { localStorage.setItem('ps-bg-gen', encode()); } catch (e) {} }
  let saveT; function saveLocalSoon() { clearTimeout(saveT); saveT = setTimeout(saveLocal, 300); }

  $('share').addEventListener('click', () => {
    const url = location.href.split('#')[0] + '#u' + encode();
    const done = () => toast('Lenke kopiert');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, () => { history.replaceState(null, '', url); toast('Lenken ligger i adressefeltet'); });
    } else { history.replaceState(null, '', url); toast('Lenken ligger i adressefeltet'); }
  });

  let toastT;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Oppstart ----------
  (function init() {
    let loaded = null;
    if (location.hash.startsWith('#u')) loaded = decode(location.hash.slice(2));
    if (!loaded) { try { const s = localStorage.getItem('ps-bg-gen'); if (s) loaded = decode(s); } catch (e) {} }
    if (loaded) state = { ...DEFAULT, ...loaded };
    sync();
    layout();
    if (!loaded) randomize();
    new ResizeObserver(layout).observe(stage);
    if (document.fonts) document.fonts.ready.then(draw);
  })();
})();
</script>
</body>
</html>
