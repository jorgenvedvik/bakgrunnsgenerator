<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakgrunnsgenerator</title>
<meta name="description" content="Lag nye utsnitt av Patentstyrets logobakgrunn og eksporter som PNG, JPG eller SVG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
<style>
/* Struktur: panel til venstre (format → visning → finjuster → eksport), verket til høyre med
   Forrige / Nytt utsnitt under. Uttrykk: mosegrønt rom, papirhvit tekst, hårfine linjer, piller,
   spiregrønn bare på hovedhandlingen. Patentstyrets farger og Roboto. */
:root {
  --art-bg: #00342e;
  --art-shape: #002b25;
  --room: #002621;
  --room-deep: #001d19;
  --paper: #fffef5;
  --paper-dim: rgba(255, 254, 245, .66);
  --paper-faint: rgba(255, 254, 245, .4);
  --hair: rgba(255, 254, 245, .12);
  --surface: rgba(0, 48, 41, .72);
  --accent: #cef261;
  --accent-ink: #00342e;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 400 14px/1.5 var(--font);
  color: var(--paper);
  background: radial-gradient(120% 90% at 60% 40%, var(--room) 0%, var(--room-deep) 100%);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 372px minmax(0, 1fr);
  height: 100%;
  gap: 0;
}

/* ---------- Panel ---------- */
.panel {
  margin: 12px 0 12px 12px;
  margin-left: max(12px, env(safe-area-inset-left, 0px));
  border-radius: 24px;
  background: var(--surface);
  border: 1px solid var(--hair);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 30px 80px -30px rgba(0,0,0,.6);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 22px 22px 8px;
  display: flex;
  flex-direction: column;
}
.mark { display: flex; align-items: center; gap: 12px; padding-bottom: 22px; }
.mark svg { width: 24px; height: 24px; flex: none; }
.mark h1 { margin: 0; font-weight: 300; font-size: 21px; letter-spacing: -.01em; line-height: 1.2; }
.mark p { margin: 1px 0 0; color: var(--paper-faint); font-size: 12.5px; }

.block { display: flex; flex-direction: column; gap: 12px; padding: 20px 0; border-top: 1px solid var(--hair); }
.label { margin: 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--paper-faint); }

/* Formatkort */
.formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fmt {
  appearance: none; cursor: pointer;
  border: 1px solid var(--hair); border-radius: 16px;
  background: transparent; color: var(--paper-dim);
  padding: 12px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-width: 0;
  transition: background .2s var(--ease), color .2s var(--ease), border-color .2s;
}
.fmt .shape { border: 1.25px solid currentColor; border-radius: 2px; opacity: .6; margin-bottom: 5px; }
.fmt .ratio { font-size: 16px; font-weight: 500; line-height: 1.1; color: var(--paper); font-variant-numeric: tabular-nums; }
.fmt .name { font-size: 12px; line-height: 1.2; }
.fmt .dim { font-size: 10.5px; line-height: 1.2; color: var(--paper-faint); font-variant-numeric: tabular-nums; }
.fmt:hover { border-color: var(--paper-faint); color: var(--paper); }
.fmt[aria-pressed="true"] { background: var(--paper); border-color: var(--paper); color: var(--accent-ink); }
.fmt[aria-pressed="true"] .ratio { color: var(--accent-ink); }
.fmt[aria-pressed="true"] .dim { color: rgba(0, 52, 46, .6); }

.custom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.custom span { color: var(--paper-faint); }
.field {
  width: 100%; border: 1px solid var(--hair); border-radius: 12px;
  background: rgba(0,0,0,.18); color: var(--paper);
  padding: 9px 12px; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
}
.field:focus { border-color: var(--paper-faint); outline: none; }

/* Brytere */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 13.5px; }
.switch small { display: block; color: var(--paper-faint); font-size: 12px; }
.switch input {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 40px; height: 24px; border-radius: 999px; position: relative;
  background: rgba(0,0,0,.25); border: 1px solid var(--hair);
  transition: background .2s var(--ease), border-color .2s;
}
.switch input::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper-dim); transition: transform .22s var(--ease), background .2s;
}
.switch input:checked { background: var(--paper); border-color: var(--paper); }
.switch input:checked::after { transform: translateX(16px); background: var(--accent-ink); }

/* Finjuster (sammenleggbar) */
details.fine { border-top: 1px solid var(--hair); }
details.fine summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 0;
}
details.fine summary::-webkit-details-marker { display: none; }
details.fine summary .t { display: flex; flex-direction: column; gap: 2px; }
details.fine summary .t b { font-weight: 400; font-size: 15px; }
details.fine summary .t small { color: var(--paper-faint); font-size: 12px; }
.chev {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: rgba(255,254,245,.07);
  transition: transform .3s var(--ease), background .2s;
}
.chev svg { width: 14px; height: 14px; }
details.fine summary:hover .chev { background: rgba(255,254,245,.14); }
details.fine[open] .chev { transform: rotate(180deg); }
.fine-body { display: flex; flex-direction: column; gap: 16px; padding-bottom: 22px; }

.slider { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 12px; }
.slider label { font-size: 13px; color: var(--paper-dim); }
.slider .val { font-size: 13px; color: var(--paper-faint); white-space: nowrap; }
.slider .num {
  width: 64px; text-align: right; border: 0; background: transparent; color: var(--paper);
  font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0;
}
.slider .num:focus { outline: none; color: var(--accent); }
.slider input[type="range"] { grid-column: 1 / -1; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0;
  background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--hair); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 2px; background: var(--hair); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -7px;
  background: var(--paper); border: 0; box-shadow: 0 2px 6px rgba(0,0,0,.4);
}
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 0; }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(206,242,97,.35); }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip {
  appearance: none; cursor: pointer; border-radius: 999px; padding: 8px 4px;
  background: transparent; border: 1px solid var(--hair); color: var(--paper-dim);
  font-size: 12.5px; display: inline-flex; justify-content: center; align-items: center; gap: 5px; min-width: 0;
}
.chip svg { width: 14px; height: 14px; flex: none; }
.chip:hover { color: var(--paper); border-color: var(--paper-faint); }
.chip[aria-pressed="true"] { background: var(--paper); color: var(--accent-ink); border-color: var(--paper); }

.text-btns { display: flex; gap: 18px; flex-wrap: wrap; }
.text-btn {
  appearance: none; border: 0; background: transparent; cursor: pointer; padding: 4px 0;
  color: var(--paper-dim); font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  border-bottom: 1px solid transparent;
}
.text-btn:hover { color: var(--paper); border-bottom-color: var(--paper-faint); }
.text-btn svg { width: 14px; height: 14px; }

/* Eksport (alltid synlig nederst i panelet) */
.export {
  padding: 18px 22px 22px;
  border-top: 1px solid var(--hair);
  display: flex; flex-direction: column; gap: 12px;
  background: rgba(0, 0, 0, .12);
}
.export-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 44px; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.22); }
.seg button {
  appearance: none; border: 0; cursor: pointer; border-radius: 999px;
  padding: 5px 0; background: transparent; color: var(--paper-dim);
  font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--accent-ink); font-weight: 500; }
.dl-main {
  appearance: none; border: 0; cursor: pointer; width: 100%;
  border-radius: 999px; padding: 13px; font-weight: 500; font-size: 15px;
  background: var(--paper); color: var(--accent-ink);
  display: flex; justify-content: center; align-items: center; gap: 8px;
}
.dl-main:hover { background: #fff; }
.dl-main svg { width: 18px; height: 18px; }
.dl-alt { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dl-alt button {
  appearance: none; cursor: pointer; border-radius: 999px; padding: 9px;
  background: transparent; border: 1px solid var(--hair); color: var(--paper); font-size: 13px;
}
.dl-alt button:hover { border-color: var(--paper-faint); }
.outsize { margin: 0; color: var(--paper-faint); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Verket ---------- */
main {
  position: relative; min-width: 0;
  display: flex; flex-direction: column;
}
.stage {
  flex: 1; min-height: 0;
  display: grid; place-items: center;
  padding: 40px 48px 64px;
  padding-right: max(48px, env(safe-area-inset-right, 0px));
}
.frame { position: relative; line-height: 0; }
.frame::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255,254,245,.06);
}
.frame canvas { display: block; }
#preview {
  cursor: grab; touch-action: none;
  box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 30px 80px -20px rgba(0,0,0,.55);
}
#preview.dragging { cursor: grabbing; }
#ghost { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#ghost.fade { transition: opacity .42s var(--ease); }
.caption {
  position: absolute; left: 0; right: 0; top: 100%;
  margin-top: 14px; line-height: 1.4;
  display: flex; flex-wrap: wrap; gap: 4px 10px;
  color: var(--paper-faint); font-size: 12px; letter-spacing: .03em;
  font-variant-numeric: tabular-nums;
}
.caption b { color: var(--paper-dim); font-weight: 500; }
.caption i { font-style: normal; color: var(--accent); opacity: .7; }

.actions { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px 14px; }
.pill {
  appearance: none; cursor: pointer;
  height: 48px; padding: 0 20px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  background: transparent; color: var(--paper); border: 1px solid var(--hair);
  transition: background .2s var(--ease), transform .2s var(--ease), opacity .2s, border-color .2s;
}
.pill svg { width: 18px; height: 18px; flex: none; }
.pill:hover { border-color: var(--paper-faint); }
.pill:disabled { opacity: .3; cursor: default; border-color: var(--hair); }
.pill.primary {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  font-weight: 500; font-size: 15px; padding: 0 26px 0 22px;
  box-shadow: 0 14px 34px -14px rgba(206,242,97,.45);
}
.pill.primary:hover { background: #d9f77a; }
.pill.primary:active { transform: scale(.97); }
.pill.primary svg { transition: transform .45s var(--ease); }
.pill.primary.spin svg { transform: rotate(180deg); }
.keys {
  color: var(--paper-faint); font-size: 11.5px; letter-spacing: .03em;
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  padding: 0 16px 20px;
}
.keys kbd {
  font: inherit; font-size: 11px; color: var(--paper-dim);
  border: 1px solid var(--hair); border-radius: 4px; padding: 0 5px;
}

.toast {
  position: fixed; left: calc(50% + 186px); z-index: 9;
  top: calc(20px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -8px);
  background: var(--paper); color: var(--accent-ink);
  border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  main { order: -1; }
  .stage { height: 58vh; padding: 20px 16px 52px; }
  .panel { margin: 0 max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); overflow: visible; }
  .panel-scroll { overflow: visible; }
  .keys { display: none; }
  .toast { left: 50%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="panel-scroll">
      <header class="mark">
        <svg viewBox="0 0 1448.03 1448.03" aria-hidden="true"><g fill="#fffef5"><path id="logoA" d=""/><path id="logoB" d=""/></g></svg>
        <div>
          <h1>Bakgrunnsgenerator</h1>
          <p>Utsnitt av logosymbolet til Some-maler</p>
        </div>
      </header>

      <section class="block" aria-labelledby="h-format">
        <p class="label" id="h-format">Format</p>
        <div class="formats" id="formats"></div>
        <div class="custom" id="customBox" hidden>
          <input class="field" type="number" id="cw" min="50" max="8000" step="1" aria-label="Bredde i piksler">
          <span>×</span>
          <input class="field" type="number" id="ch" min="50" max="8000" step="1" aria-label="Høyde i piksler">
        </div>
      </section>

      <section class="block" aria-labelledby="h-visning">
        <p class="label" id="h-visning">Visning</p>
        <label class="switch"><span>Hjelpelinjer<small>Marger og plass til logo, vises ikke i eksporten</small></span><input type="checkbox" role="switch" id="guide" checked></label>
      </section>

      <details class="fine" id="fine">
        <summary>
          <span class="t"><b>Finjuster utsnittet</b><small>Skalering, rotasjon, posisjon og farger</small></span>
          <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </summary>
        <div class="fine-body">
          <div class="slider">
            <label for="size">Skalering</label>
            <span class="val"><input class="num" type="number" id="sizeN" min="30" max="1200" step="1" aria-label="Skalering i prosent"> %</span>
            <input type="range" id="size" min="30" max="1200" step="1">
          </div>
          <div class="slider">
            <label for="rot">Rotasjon</label>
            <span class="val"><input class="num" type="number" id="rotN" min="-180" max="180" step="1" aria-label="Rotasjon i grader"> °</span>
            <input type="range" id="rot" min="-180" max="180" step="1">
          </div>
          <div class="chips">
            <button class="chip" id="rotL" type="button" title="Roter 90° mot klokka">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>−90°
            </button>
            <button class="chip" id="rotR" type="button" title="Roter 90° med klokka">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>+90°
            </button>
            <button class="chip" id="flipX" type="button" aria-pressed="false" title="Speilvend vannrett">Speil</button>
            <button class="chip" id="flipY" type="button" aria-pressed="false" title="Speilvend loddrett">Vend</button>
          </div>
          <div class="slider">
            <label for="px">Flytt vannrett</label>
            <span class="val"><input class="num" type="number" id="pxN" min="-400" max="500" step="0.5" aria-label="Vannrett posisjon i prosent"> %</span>
            <input type="range" id="px" min="-400" max="500" step="0.5">
          </div>
          <div class="slider">
            <label for="py">Flytt loddrett</label>
            <span class="val"><input class="num" type="number" id="pyN" min="-400" max="500" step="0.5" aria-label="Loddrett posisjon i prosent"> %</span>
            <input type="range" id="py" min="-400" max="500" step="0.5">
          </div>
          <label class="switch"><span>Bytt om fargene<small>Lys form på mørk bunn</small></span><input type="checkbox" role="switch" id="swap"></label>
          <div class="text-btns">
            <button class="text-btn" id="reset" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Tilbakestill
            </button>
            <button class="text-btn" id="share" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>Kopier lenke til utsnittet
            </button>
          </div>
        </div>
      </details>
    </div>

    <section class="export" aria-labelledby="h-export">
      <div class="export-head">
        <p class="label" id="h-export">Eksporter</p>
        <div class="seg" id="mult" role="group" aria-label="Oppløsning for PNG og JPG">
          <button type="button" data-m="1" aria-pressed="true">1×</button>
          <button type="button" data-m="2" aria-pressed="false">2×</button>
          <button type="button" data-m="3" aria-pressed="false">3×</button>
        </div>
      </div>
      <button class="dl-main" id="dlPng" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Last ned PNG
      </button>
      <div class="dl-alt">
        <button id="dlSvg" type="button">SVG · vektor</button>
        <button id="dlJpg" type="button">JPG</button>
      </div>
      <p class="outsize" id="outsize"></p>
    </section>
  </aside>

  <main>
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="preview" tabindex="0" aria-label="Forhåndsvisning. Dra for å flytte, scroll for å skalere."></canvas>
        <canvas id="ghost" aria-hidden="true"></canvas>
        <div class="caption" id="caption" aria-live="polite"></div>
      </div>
    </div>
    <div class="actions">
      <button class="pill" id="prev" type="button" disabled title="Gå tilbake til forrige utsnitt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        Forrige
      </button>
      <button class="pill primary" id="random" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        Nytt utsnitt
      </button>
    </div>
    <div class="keys">
      <span><kbd>Mellomrom</kbd> nytt utsnitt</span>
      <span>Dra for å flytte</span>
      <span>Scroll for å skalere</span>
      <span><kbd>Shift</kbd> + scroll roterer</span>
      <span><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> finjusterer</span>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ---------- Merkevare ----------
  const COLORS = { bg: '#00342e', shape: '#002b25' };
  const VB = 1448.03, C = VB / 2;
  const PATHS = [
    'M342.42,1022.3V449.01s381.6,0,381.6,0v-170.2s-465.8,0-465.8,0c-46.58,0-84.2,37.62-84.2,84.2v890.39c0,46.58,37.62,84.2,84.2,84.2h465.8c0-93.16-75.24-170.2-170.2-170.2H215.22s0-19.71,0-19.71c69.87,1.79,127.2-55.54,127.2-125.41h0Z',
    'M1105.61,425.73v573.29s-381.6,0-381.6,0v170.2s465.8,0,465.8,0c46.58,0,84.2-37.62,84.2-84.2V194.62c0-46.58-37.62-84.2-84.2-84.2h-465.8c0,93.16,75.24,170.2,170.2,170.2h338.6s0,19.71,0,19.71c-69.87-1.79-127.2,55.54-127.2,125.41h0Z'
  ];
  const P2D = PATHS.map(d => new Path2D(d));
  document.getElementById('logoA').setAttribute('d', PATHS[0]);
  document.getElementById('logoB').setAttribute('d', PATHS[1]);

  const FORMATS = [
    { id: 'sq',   name: 'Kvadrat',  ratio: '1:1',    w: 1080, h: 1080 },
    { id: 'p45',  name: 'Stående',  ratio: '4:5',    w: 1080, h: 1350 },
    { id: 'st',   name: 'Story',    ratio: '9:16',   w: 1080, h: 1920 },
    { id: 'li',   name: 'Lenke',    ratio: '1,91:1', w: 1200, h: 628  },
    { id: 'wide', name: 'Bred',     ratio: '16:9',   w: 1920, h: 1080 },
    { id: 'cust', name: 'Annet',    ratio: 'B:H',    w: 1080, h: 1080 },
  ];

  // Standard = Patentstyrets eget kvadratiske utsnitt (målt fra Bakgrunn_01)
  const DEFAULT = { f: 'sq', w: 1080, h: 1080, x: 282.1, y: 88.2, s: 621.7, r: 56.8, fx: false, fy: false, sw: false };
  let state = { ...DEFAULT };
  let guide = true;
  let mult = 1;
  let manual = false;   // true når brukeren har justert utsnittet for hånd

  // ---------- Geometri ----------
  // x, y: senter av logosymbolet i prosent av bredde/høyde
  // s: symbolets størrelse i prosent av lengste side
  function applyTransform(ctx, W, H) {
    const k = (state.s / 100) * Math.max(W, H) / VB;
    ctx.translate(state.x / 100 * W, state.y / 100 * H);
    ctx.rotate(state.r * Math.PI / 180);
    ctx.scale(k * (state.fx ? -1 : 1), k * (state.fy ? -1 : 1));
    ctx.translate(-C, -C);
  }
  function svgTransform(W, H) {
    const k = (state.s / 100) * Math.max(W, H) / VB;
    const r = n => +n.toFixed(4);
    return `translate(${r(state.x / 100 * W)} ${r(state.y / 100 * H)}) rotate(${r(state.r)}) scale(${r(k * (state.fx ? -1 : 1))} ${r(k * (state.fy ? -1 : 1))}) translate(${-C} ${-C})`;
  }
  const colors = () => state.sw ? { bg: COLORS.shape, shape: COLORS.bg } : { bg: COLORS.bg, shape: COLORS.shape };

  function paint(ctx, W, H) {
    const c = colors();
    ctx.save();
    ctx.fillStyle = c.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    applyTransform(ctx, W, H);
    ctx.fillStyle = c.shape;
    P2D.forEach(p => ctx.fill(p));
    ctx.restore();
  }

  // ---------- Forhåndsvisning ----------
  const cv = document.getElementById('preview');
  const stage = document.getElementById('stage');
  const ghost = document.getElementById('ghost');
  // Myk overtoning: forrige bilde legges over og tones ut
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function crossfade() {
    if (reduceMotion || !cv.width) return;
    const g = ghost.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, ghost.width, ghost.height);
    g.drawImage(cv, 0, 0);
    ghost.classList.remove('fade');
    ghost.style.opacity = '1';
    void ghost.offsetWidth;
    ghost.classList.add('fade');
    ghost.style.opacity = '0';
  }
  let cssW = 0, cssH = 0;

  function layout() {
    const r = stage.getBoundingClientRect();
    const cs = getComputedStyle(stage);
    const availW = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const k = Math.min(availW / state.w, availH / state.h);
    cssW = Math.max(40, Math.floor(state.w * k));
    cssH = Math.max(40, Math.floor(state.h * k));
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = cssW + 'px';
    cv.style.height = cssH + 'px';
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    ghost.style.width = cv.style.width; ghost.style.height = cv.style.height;
    ghost.width = cv.width; ghost.height = cv.height;
    draw();
  }

  function draw() {
    const ctx = cv.getContext('2d');
    const k = cv.width / state.w;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    paint(ctx, state.w, state.h);
    if (guide) drawGuides(ctx, state.w, state.h, k);
  }

  function drawGuides(ctx, W, H, k) {
    ctx.save();
    const lw = 1 / k;
    const m = Math.min(W, H) * 0.074;            // marg som i malene (~80 px på 1080)
    ctx.strokeStyle = 'rgba(212,242,106,.55)';
    ctx.lineWidth = lw;
    ctx.setLineDash([6 * lw, 5 * lw]);
    ctx.strokeRect(m, m, W - 2 * m, H - 2 * m);
    // Logosone nederst, sentrert
    const lh = Math.min(W, H) * 0.06;
    const lwid = Math.min(W, H) * 0.32;
    const ly = H - m - lh;
    ctx.fillStyle = 'rgba(212,242,106,.08)';
    ctx.fillRect((W - lwid) / 2, ly, lwid, lh);
    ctx.strokeRect((W - lwid) / 2, ly, lwid, lh);
    // Midtlinjer
    ctx.strokeStyle = 'rgba(212,242,106,.22)';
    ctx.beginPath();
    ctx.moveTo(W / 2, m); ctx.lineTo(W / 2, ly - m * 0.4);
    ctx.moveTo(m, H / 2); ctx.lineTo(W - m, H / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(212,242,106,.7)';
    ctx.font = `500 ${Math.round(Math.min(W, H) * 0.017)}px Roboto, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('LOGO', W / 2, ly + lh / 2);
    ctx.restore();
  }

  // ---------- Kontroller ----------
  const $ = id => document.getElementById(id);
  const fmtBox = $('formats');
  FORMATS.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fmt';
    b.dataset.id = f.id;
    const max = 20;
    const sw = f.id === 'cust' ? 16 : (f.w >= f.h ? max : Math.round(max * f.w / f.h));
    const sh = f.id === 'cust' ? 12 : (f.h >= f.w ? max : Math.round(max * f.h / f.w));
    b.innerHTML = `<span class="shape" style="width:${sw}px;height:${sh}px;${f.id === 'cust' ? 'border-style:dashed' : ''}"></span><span class="ratio">${f.ratio}</span><span class="name">${f.name}</span><span class="dim">${f.id === 'cust' ? 'egendefinert' : f.w + '×' + f.h}</span>`;
    b.addEventListener('click', () => {
      state.f = f.id;
      if (f.id !== 'cust') { state.w = f.w; state.h = f.h; }
      sync(); layout();
      // Et utsnitt laget for ett format passer sjelden et annet, så vi lager et nytt –
      // med mindre brukeren har justert for hånd.
      if (!manual && f.id !== 'cust') randomize(); else saveLocal();
    });
    fmtBox.appendChild(b);
  });

  function bindPair(rangeId, numId, key, min, max) {
    const r = $(rangeId), n = $(numId);
    const set = v => {
      v = parseFloat(v);
      if (!isFinite(v)) return;
      state[key] = Math.min(max, Math.max(min, v)); manual = true;
      sync(); draw(); saveLocal();
    };
    r.addEventListener('input', () => set(r.value));
    n.addEventListener('change', () => set(n.value));
  }
  bindPair('size', 'sizeN', 's', 30, 1200);
  bindPair('rot', 'rotN', 'r', -180, 180);
  bindPair('px', 'pxN', 'x', -400, 500);
  bindPair('py', 'pyN', 'y', -400, 500);

  const normRot = r => { r = ((r + 180) % 360 + 360) % 360 - 180; return Math.round(r * 10) / 10; };
  $('rotL').addEventListener('click', () => { manual = true; state.r = normRot(state.r - 90); sync(); draw(); saveLocal(); });
  $('rotR').addEventListener('click', () => { manual = true; state.r = normRot(state.r + 90); sync(); draw(); saveLocal(); });
  $('flipX').addEventListener('click', () => { manual = true; state.fx = !state.fx; sync(); draw(); saveLocal(); });
  $('flipY').addEventListener('click', () => { manual = true; state.fy = !state.fy; sync(); draw(); saveLocal(); });
  $('swap').addEventListener('change', e => { state.sw = e.target.checked; sync(); draw(); saveLocal(); });
  $('guide').addEventListener('change', e => { guide = e.target.checked; draw(); });

  const clampDim = v => Math.min(8000, Math.max(50, Math.round(+v || 0)));
  $('cw').addEventListener('change', e => { state.w = clampDim(e.target.value); sync(); layout(); saveLocal(); });
  $('ch').addEventListener('change', e => { state.h = clampDim(e.target.value); sync(); layout(); saveLocal(); });

  $('reset').addEventListener('click', () => {
    const { f, w, h } = state;
    state = { ...DEFAULT, f, w, h };
    manual = false;
    sync(); draw(); saveLocal(); toast('Utsnittet er tilbakestilt');
  });

  $('mult').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mult = +b.dataset.m; sync();
  });

  // Forenkler bredde:høyde til et lesbart forhold, f.eks. 1200×628 → 1,91:1
  function ratioLabel(w, h) {
    const g = (a, b) => b ? g(b, a % b) : a;
    const d = g(w, h), a = w / d, b = h / d;
    if (a <= 32 && b <= 32) return `${a}:${b}`;
    const r = w >= h ? w / h : h / w;
    const t = r.toFixed(2).replace(/0+$/, '').replace(/\.$/, '').replace('.', ',');
    return w >= h ? `${t}:1` : `1:${t}`;
  }
  function sync() {
    fmtBox.querySelectorAll('.fmt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === state.f)));
    $('customBox').hidden = state.f !== 'cust';
    $('cw').value = state.w; $('ch').value = state.h;
    const custBtn = fmtBox.querySelector('[data-id="cust"]');
    if (custBtn) {
      custBtn.querySelector('.ratio').textContent = state.f === 'cust' ? ratioLabel(state.w, state.h) : 'B:H';
      custBtn.querySelector('.dim').textContent = state.f === 'cust' ? `${state.w}×${state.h}` : 'egendefinert';
    }
    const fix = v => Math.round(v * 10) / 10;
    $('size').value = state.s; $('sizeN').value = Math.round(state.s);
    $('rot').value = state.r;  $('rotN').value = fix(state.r);
    $('px').value = state.x;   $('pxN').value = fix(state.x);
    $('py').value = state.y;   $('pyN').value = fix(state.y);
    $('flipX').setAttribute('aria-pressed', String(state.fx));
    $('flipY').setAttribute('aria-pressed', String(state.fy));
    $('swap').checked = state.sw;
    $('mult').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.m === mult)));
    const fmt = FORMATS.find(f => f.id === state.f);
    const ratio = state.f === 'cust' ? ratioLabel(state.w, state.h) : fmt.ratio;
    const sep = '<i aria-hidden="true">*</i>';
    $('caption').innerHTML = [
      `<b>${ratio}</b>`,
      `${state.w} × ${state.h} px`,
      `Skalering ${Math.round(state.s)} %`,
      `Rotasjon ${String(fix(state.r)).replace('.', ',')}°`,
      state.sw ? 'Byttede farger' : null,
    ].filter(Boolean).join(sep);
    $('outsize').textContent = `PNG/JPG ${state.w * mult} × ${state.h * mult} px  ·  SVG ${state.w} × ${state.h}`;
  }

  // ---------- Dra, scroll, klyp, tastatur ----------
  const pointers = new Map();
  let pinchStart = null;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cv.classList.add('dragging');
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), s: state.s };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);
    manual = true;
    if (pointers.size === 1) {
      state.x += (cur.x - prev.x) / cssW * 100;
      state.y += (cur.y - prev.y) / cssH * 100;
      state.x = Math.min(500, Math.max(-400, state.x));
      state.y = Math.min(500, Math.max(-400, state.y));
    } else if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      state.s = Math.min(1200, Math.max(30, pinchStart.s * d / pinchStart.d));
    }
    sync(); draw();
  });
  const end = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) { cv.classList.remove('dragging'); saveLocal(); }
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    manual = true;
    if (e.shiftKey) {
      const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
      state.r = normRot(state.r + Math.sign(d) * Math.min(6, Math.abs(d) * 0.05 + 1));
    } else {
      state.s = Math.min(1200, Math.max(30, state.s * Math.exp(-e.deltaY * 0.0015)));
    }
    sync(); draw(); saveLocalSoon();
  }, { passive: false });

  cv.addEventListener('keydown', e => {
    const step = e.shiftKey ? 5 : 0.5;
    const map = { ArrowLeft: ['x', -step], ArrowRight: ['x', step], ArrowUp: ['y', -step], ArrowDown: ['y', step] };
    if (map[e.key]) { e.preventDefault(); state[map[e.key][0]] += map[e.key][1]; }
    else if (e.key === '+' || e.key === '=') state.s = Math.min(1200, state.s * 1.05);
    else if (e.key === '-') state.s = Math.max(30, state.s / 1.05);
    else if (e.key === 'r' || e.key === 'R') state.r = normRot(state.r + (e.shiftKey ? -1 : 1));
    else return;
    manual = true;
    sync(); draw(); saveLocalSoon();
  });

  // ---------- Tilfeldig utsnitt ----------
  // Reglene er målt fra Patentstyrets egne, håndlagde utsnitt:
  //  * Symbolet er forstørret 5,6–8,6 ganger (i prosent av lengste side).
  //  * Enden av den smale kanalen i symbolet («innhugget») ligger inne i bildet, nær en kant.
  //    Derfra vider kanalen seg ut som et lyst bånd over midten av bildet.
  //  * Symbolet dekker minst to av de fire hjørnene og 42–68 % av flaten.
  //  * Kjernen i midten (60 % × 24 %) er nesten fri for symbolet, så tekst ligger rolig.
  // Symbolet er punktsymmetrisk, så innhugget finnes to steder (oppe til høyre og nede til venstre).
  const TIPS = [[1232.8, 290.4], [215.2, 1157.6]];
  const RULES = { sMin: 560, sMax: 860, covMin: 0.42, covMax: 0.68, coreMax: 0.25, cornersMin: 2 };
  const rnd = (a, b) => a + Math.random() * (b - a);

  const probe = document.createElement('canvas');
  const PROBE = 64;
  function measure(cand) {
    const PW = PROBE, PH = Math.max(16, Math.round(PROBE * cand.h / cand.w));
    if (probe.width !== PW || probe.height !== PH) { probe.width = PW; probe.height = PH; }
    const ctx = probe.getContext('2d', { willReadFrequently: true });
    const saved = state; state = cand;
    ctx.setTransform(PW / cand.w, 0, 0, PH / cand.h, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cand.w, cand.h);
    applyTransform(ctx, cand.w, cand.h);
    ctx.fillStyle = '#fff'; P2D.forEach(p => ctx.fill(p));
    state = saved;
    const d = ctx.getImageData(0, 0, PW, PH).data;
    let on = 0, coreOn = 0, coreN = 0;
    const corner = [0, 0, 0, 0], cornerN = [0, 0, 0, 0];
    for (let y = 0; y < PH; y++) {
      const v = (y + 0.5) / PH;
      for (let x = 0; x < PW; x++) {
        const u = (x + 0.5) / PW;
        const f = d[(y * PW + x) * 4] > 127 ? 1 : 0;
        on += f;
        if (Math.abs(u - 0.5) < 0.2 && Math.abs(v - 0.5) < 0.12) { coreOn += f; coreN++; }
        const ci = (u < 0.1 ? 0 : u > 0.9 ? 1 : -1);
        const cj = (v < 0.1 ? 0 : v > 0.9 ? 2 : -1);
        if (ci >= 0 && cj >= 0) { corner[ci + cj] += f; cornerN[ci + cj]++; }
      }
    }
    return {
      cov: on / (PW * PH),
      core: coreOn / Math.max(1, coreN),
      corners: corner.filter((c, i) => c / Math.max(1, cornerN[i]) > 0.6).length,
    };
  }

  function candidate() {
    const W = state.w, H = state.h;
    const s = rnd(RULES.sMin, RULES.sMax);
    const r = Math.round(rnd(-180, 180) * 10) / 10;
    const fx = Math.random() < 0.5;
    const [tX, tY] = TIPS[Math.random() < 0.5 ? 0 : 1];
    // Innhugget plasseres nær en tilfeldig kant, inne i bildet
    const t = rnd(0.08, 0.92), dEdge = rnd(0.04, 0.2);
    const [u, v] = [[t, dEdge], [1 - dEdge, t], [t, 1 - dEdge], [dEdge, t]][Math.floor(Math.random() * 4)];
    const k = (s / 100) * Math.max(W, H) / VB;
    const a = r * Math.PI / 180;
    const vx = (tX - C) * k * (fx ? -1 : 1), vy = (tY - C) * k;
    const rx = vx * Math.cos(a) - vy * Math.sin(a), ry = vx * Math.sin(a) + vy * Math.cos(a);
    return { ...state, s, r, fx, fy: false, x: (u * W - rx) / W * 100, y: (v * H - ry) / H * 100 };
  }

  function score(m) {
    let p = 0;
    if (m.cov < RULES.covMin) p += RULES.covMin - m.cov;
    if (m.cov > RULES.covMax) p += m.cov - RULES.covMax;
    if (m.core > RULES.coreMax) p += (m.core - RULES.coreMax) * 2;
    if (m.corners < RULES.cornersMin) p += (RULES.cornersMin - m.corners) * 0.3;
    return p;   // 0 = oppfyller alle reglene
  }

  const undoStack = [];
  function pushHistory() {
    undoStack.push({ ...state });
    if (undoStack.length > 40) undoStack.shift();
    $('prev').disabled = false;
  }
  $('prev').addEventListener('click', () => {
    const last = undoStack.pop();
    if (!last) return;
    crossfade();
    state = { ...last, f: state.f, w: state.w, h: state.h };
    $('prev').disabled = undoStack.length === 0;
    sync(); draw(); saveLocal();
  });

  function randomize(opts = {}) {
    let best = null;
    for (let i = 0; i < 600; i++) {
      const cand = candidate();
      const sc = score(measure(cand));
      if (!best || sc < best.sc) best = { cand, sc };
      if (sc === 0) break;
    }
    if (!opts.silent) {
      pushHistory();
      crossfade();
      const rb = $('random');
      rb.classList.toggle('spin');
    }
    state = best.cand;
    manual = false;
    sync(); draw(); saveLocal();
  }
  $('random').addEventListener('click', () => randomize());
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    const t = e.target;
    if (t.closest && t.closest('input, button, select, textarea, summary')) return;
    e.preventDefault(); randomize();
  });

  // Husk om finjusteringspanelet er åpent
  // Husk om finjusteringen er åpen
  try { if (localStorage.getItem('ps-bg-fine') === '1') $('fine').open = true; } catch (e) {}
  $('fine').addEventListener('toggle', () => { try { localStorage.setItem('ps-bg-fine', $('fine').open ? '1' : '0'); } catch (e) {} });

  // ---------- Eksport ----------
  const fileBase = () => `patentstyret-bakgrunn-${state.w}x${state.h}`;
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function renderRaster(type, ext, quality) {
    const W = state.w * mult, H = state.h * mult;
    if (W * H > 268e6) { toast('Bildet blir for stort. Velg lavere oppløsning.'); return; }
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.setTransform(mult, 0, 0, mult, 0, 0);
    paint(ctx, state.w, state.h);
    c.toBlob(b => {
      if (!b) { toast('Eksporten feilet. Prøv lavere oppløsning.'); return; }
      download(b, `${fileBase()}${mult > 1 ? '@' + mult + 'x' : ''}.${ext}`);
      toast(`${ext.toUpperCase()} lastet ned`);
    }, type, quality);
  }
  $('dlPng').addEventListener('click', () => renderRaster('image/png', 'png'));
  $('dlJpg').addEventListener('click', () => renderRaster('image/jpeg', 'jpg', 0.95));
  $('dlSvg').addEventListener('click', () => {
    const { w: W, h: H } = state, c = colors();
    const svg =
`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs><clipPath id="flate"><rect width="${W}" height="${H}"/></clipPath></defs>
  <rect width="${W}" height="${H}" fill="${c.bg}"/>
  <g clip-path="url(#flate)">
    <g transform="${svgTransform(W, H)}" fill="${c.shape}">
      <path d="${PATHS[0]}"/>
      <path d="${PATHS[1]}"/>
    </g>
  </g>
</svg>
`;
    download(new Blob([svg], { type: 'image/svg+xml' }), `${fileBase()}.svg`);
    toast('SVG lastet ned');
  });

  // ---------- Lagring og deling ----------
  const KEYS = ['f', 'w', 'h', 'x', 'y', 's', 'r', 'fx', 'fy', 'sw'];
  function encode() {
    const r1 = v => typeof v === 'number' ? Math.round(v * 10) / 10 : (v === true ? 1 : v === false ? 0 : v);
    return KEYS.map(k => r1(state[k])).join('_');
  }
  function decode(str) {
    const parts = str.split('_');
    if (parts.length !== KEYS.length) return null;
    const o = {};
    KEYS.forEach((k, i) => {
      const v = parts[i];
      if (k === 'f') o[k] = FORMATS.some(f => f.id === v) ? v : 'sq';
      else if (['fx', 'fy', 'sw'].includes(k)) o[k] = v === '1';
      else o[k] = parseFloat(v);
    });
    if (KEYS.some(k => typeof o[k] === 'number' && !isFinite(o[k]))) return null;
    o.w = clampDim(o.w); o.h = clampDim(o.h);
    return o;
  }
  function saveLocal() { try { localStorage.setItem('ps-bg-gen', encode()); } catch (e) {} }
  let saveT; function saveLocalSoon() { clearTimeout(saveT); saveT = setTimeout(saveLocal, 300); }

  $('share').addEventListener('click', () => {
    const url = location.href.split('#')[0] + '#u' + encode();
    const done = () => toast('Lenke kopiert');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, () => { history.replaceState(null, '', url); toast('Lenken ligger i adressefeltet'); });
    } else { history.replaceState(null, '', url); toast('Lenken ligger i adressefeltet'); }
  });

  let toastT;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Oppstart ----------
  (function init() {
    let loaded = null;
    if (location.hash.startsWith('#u')) loaded = decode(location.hash.slice(2));
    if (!loaded) { try { const s = localStorage.getItem('ps-bg-gen'); if (s) loaded = decode(s); } catch (e) {} }
    if (loaded) state = { ...DEFAULT, ...loaded };
    sync();
    layout();
    if (!loaded) randomize({ silent: true });
    new ResizeObserver(layout).observe(stage);
    if (document.fonts) document.fonts.ready.then(draw);
  })();
})();
</script>
</body>
